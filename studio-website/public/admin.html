<!doctype html><html lang="en"><head><meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"><meta name="referrer" content="strict-origin-when-cross-origin"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" href="favicon.svg"><title>Product manager | Cerise Demoiselle Studio</title><link rel="stylesheet" href="style.css"><style>.admin{max-width:1050px;margin:35px auto;padding:0 25px}.tools{display:flex;justify-content:space-between;gap:20px;align-items:center}.admin-row{display:flex;gap:20px;align-items:center;padding:18px 0;border-bottom:1px solid var(--line)}.admin-row img{height:70px;width:70px;object-fit:cover}.admin-row .info{flex:1}.admin-row button{padding:9px 14px;border:1px solid var(--line);background:transparent;color:var(--ink)}#editor{padding:40px;max-width:620px}#editor label{display:block;margin:18px 0;font-size:13px}#editor input,#editor textarea,#editor select{display:block;margin-top:8px;width:100%;padding:12px;border:1px solid var(--line);background:white;color:var(--ink)}#editor textarea{min-height:110px}#imagePreview{width:120px;height:120px;object-fit:contain}.admin-row h3{margin:0 0 8px}.error{color:#a02626}.status{font-size:12px;color:var(--muted)}@media(max-width:600px){.admin-row{gap:10px;flex-wrap:wrap}.admin-row .info{min-width:150px}.tools{flex-wrap:wrap}#editor{padding:30px 20px}}</style></head><body><header><a class="brand" href="/"><img src="logo.svg" alt="Cerise Demoiselle Studio"></a><a href="/">View website ↗</a></header><section id="loginPanel" class="admin" style="max-width:440px"><h1 style="font-size:38px">Admin sign in</h1><form id="loginForm"><label style="display:block;margin:20px 0">Username<input name="username" autocomplete="username" required style="display:block;width:100%;padding:12px;margin-top:8px;border:1px solid var(--line);border-radius:12px"></label><label style="display:block;margin:20px 0">Password<input name="password" type="password" autocomplete="current-password" required style="display:block;width:100%;padding:12px;margin-top:8px;border:1px solid var(--line);border-radius:12px"></label><button class="primary" id="loginSubmit">Sign in</button><p id="loginStatus" role="status"></p></form></section><main class="admin" id="managerPanel" hidden><p class="eyebrow">PRODUCT MANAGER</p><button id="logout" class="primary" style="float:right">Sign out</button><div class="tools"><h1 style="font-size:45px">Your products</h1><button class="primary" id="new">Add product +</button></div><p class="small">Update photos, selling prices, stock quantities and availability. Only signed-in administrators can save changes. Saved changes appear on the catalogue after refresh.</p><p id="message" role="status">Connecting to your catalogue…</p><div id="items"></div></main><dialog id="editor" aria-labelledby="editTitle"><button class="close" aria-label="Close editor">×</button><form id="form"><h2 id="editTitle">Add product</h2><label>Product name<input name="name" required maxlength="200"></label><label>Short description<textarea name="description" required maxlength="4000"></textarea></label><label>Reference or size (optional)<input name="reference" maxlength="1000"></label><label>Selling price (Rs)<input name="price" type="number" required min="0" step="0.01"></label><label>Availability<select name="status"><option value="on-order">Made to order</option><option value="in-stock">In stock</option><option value="out-of-stock">Out of stock</option></select></label><label>Stock quantity (leave blank if unknown)<input name="stock" type="number" min="0" step="1"></label><label>Product photo<input id="photo" type="file" accept="image/jpeg,image/png,image/webp"></label><img id="imagePreview" hidden alt="Product photo preview"><p id="formStatus" role="status"></p><button type="submit" id="submit" class="primary">Save product</button></form></dialog><script src="admin.js"></script></body></html>
